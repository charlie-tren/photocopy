  <circle cx="26" cy="50" r="8.85" fill="#f2f1ee"/>
  <circle cx="50" cy="50" r="7.2" fill="#f2f1ee"/>
  <circle cx="74" cy="50" r="5.55" fill="#f2f1ee"/>
  <circle cx="26" cy="74" r="7.2" fill="#f2f1ee"/>
