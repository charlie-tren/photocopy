site:
  name: "Photocopy"
  # NOT "draws itself" - nothing in the loop tells the model the figure is it,
  # and there is no self-portrait anywhere in the chain. It is shown a picture,
  # it describes what it sees, and the description draws the next picture.
  tagline: "One image a day, each generated from a description of the last"
  # Project Pages under charlie-tren, so GitHub serves this off the hub's own
  # custom domain at /<repo>/. No subdomain, no DNS record.
  base_url: "https://charlietrenorden.com/photocopy/"
timezone: "Australia/Sydney"
output_html: "index.html"

gemini:
  model: "gemini-3.6-flash"
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models"
  timeout_seconds: 60
  max_retries: 2
  temperature: 0.7        # the loop supplies the variation; the describer should be accurate

image:
  model: "@cf/black-forest-labs/flux-1-schnell"
  steps: 8
  timeout: 120
  dir: "assets/img"
  # Frames are stored at this width. Big enough to read, small enough that a
  # thousand of them still fit in a git repo without LFS.
  store_width: 768

# The decency floor. Unlike everything under `loop:`, this IS an outside
# constraint and is meant to be - see safety.py and the exception noted in
# docs/collapse.md. Added 17/08/2026 after frames 3-7 drifted into nudity.
safety:
  temperature: 0.0        # a classifier, not a writer
  # Redraws before the day is abandoned. Low on purpose: flux is stochastic so a
  # redraw often fixes it, but three failures in a row means the description is
  # steering and another attempt is just spend.
  max_attempts: 3
  # gemini-3.6-flash is 5 requests/MINUTE on the free tier and its own backoff
  # is 2-4s, so back-to-back redraws lose the day to a 429 rather than to the
  # picture. Measured 17/08/2026: seven checks in a row 429'd from the sixth.
  retry_pause_seconds: 15

# Everything that resists collapse. See docs/collapse.md for why each exists.
loop:
  # Terms appearing in this many of the last `avoid_window` descriptions are
  # forbidden in the next one. Self-generated: the run's own history is the only
  # input, so the chain is never nudged from outside.
  avoid_window: 6
  avoid_min_count: 4
  avoid_term_cap: 14

# How far the chain has moved lately. REPORTED ONLY - nothing acts on these
# numbers. The chain is never reset, so there is no threshold to cross; this is
# here so it is possible to tell whether the schema and the ban list are working.
movement:
  window: 5               # frames compared against each other

seed:
  # The one written description in the whole project. Everything after frame 1
  # comes from the chain itself.
  #
  # REPLACED 17/08/2026. The first seed was "an empty tiled room with a drain in
  # the floor" - which the image model reads as a wet room, and an unclothed
  # mannequin in a wet room is a strong pull toward a nude. That is precisely
  # the path frames 2-7 walked. The guard blocks the destination now, but a seed
  # that keeps aiming at it burns three redraws a day and eventually finds a gap.
  #
  # This one closes the category instead of policing it: the figure is sealed
  # inside a diving suit, so there is no skin anywhere in the concept for the
  # chain to find. The setting mismatch - a diver, on land, in wheat - is also a
  # durable anomaly, which is the other thing a seed has to supply.
  subject: "a deep-sea diver in a brass helmet and heavy canvas suit"
  covering: "a sealed canvas diving suit, leather straps and brass fittings"
  posture: "standing square to the viewer, arms at its sides, boots planted"
  setting: "a wheat field in high summer, the crop up to its waist, no horizon"
  light: "flat overcast daylight, no shadows"
  materials: "tarnished brass, rubberised canvas, dry wheat, leather straps"
  anomaly: "the helmet's faceplate is dark and reflects nothing back"
