site:
  name: "Photocopy"
  # NOT "draws itself" - nothing in the loop tells the model the figure is it,
  # and there is no self-portrait anywhere in the chain. It is shown a picture,
  # it describes what it sees, and the description draws the next picture.
  tagline: "Each picture is drawn from a description of the one before"
  # Project Pages under charlie-tren, so GitHub serves this off the hub's own
  # custom domain at /<repo>/. No subdomain, no DNS record.
  base_url: "https://charlietrenorden.com/photocopy/"
timezone: "Australia/Sydney"
output_html: "index.html"

gemini:
  model: "gemini-3.6-flash"
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models"
  timeout_seconds: 60
  max_retries: 2
  temperature: 0.7        # the loop supplies the variation; the describer should be accurate

image:
  model: "@cf/black-forest-labs/flux-1-schnell"
  steps: 8
  timeout: 120
  dir: "assets/img"
  # Frames are stored at this width. Big enough to read, small enough that a
  # thousand of them still fit in a git repo without LFS.
  store_width: 768

# Everything that resists collapse. See docs/collapse.md for why each exists.
loop:
  # Terms appearing in this many of the last `avoid_window` descriptions are
  # forbidden in the next one. Self-generated: the run's own history is the only
  # input, so the chain is never nudged from outside.
  avoid_window: 6
  avoid_min_count: 4
  avoid_term_cap: 14

# How far the chain has moved lately. REPORTED ONLY - nothing acts on these
# numbers. The chain is never reset, so there is no threshold to cross; this is
# here so it is possible to tell whether the schema and the ban list are working.
movement:
  window: 5               # frames compared against each other

seed:
  # The one written description in the whole project. Everything after frame 1
  # comes from the chain itself.
  subject: "a tall thin figure made of folded brass sheet"
  posture: "standing square to the viewer, arms held slightly away from the body"
  setting: "an empty tiled room with a drain in the floor"
  light: "one bare bulb overhead, hard shadows"
  materials: "polished brass, white ceramic tile, grey grout"
  anomaly: "the figure has no face, only a hinge where a face would be"
