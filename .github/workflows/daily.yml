name: daily-frame

on:
  schedule:
    # 20:40 UTC / 06:40 AEST. Deliberately off the hour: The Aftertimes found
    # that the on-the-hour slot is congested enough on GitHub's schedulers to be
    # dropped or run an hour late.
    # Two crons, both inside the same UTC day so the already-filed guard in
    # step.py makes the second one a no-op when the first worked. The Aftertimes
    # learned this the hard way: a single on-the-hour schedule ran 40-64 minutes
    # late and was sometimes dropped entirely.
    - cron: "40 20 * * *"   # 20:40 UTC / 06:40 AEST - primary
    - cron: "40 22 * * *"   # 22:40 UTC / 08:40 AEST - backup if the primary was dropped
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two frames in one day would both describe the same parent, and the chain's
  # only claim is that each frame came from the one before it.
  group: chain
  cancel-in-progress: false

jobs:
  frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest tests/ -q
      - name: Advance the chain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python step.py
      - name: Commit and push
        run: |
          git config user.name "photocopy bot"
          git config user.email "actions@github.com"
          git add -A
          # The frame itself is stamped in Australia/Sydney (common.tz_now), so
          # the runner's UTC date disagrees with it for the ~10h either side of
          # midnight - which is exactly when this job runs. Read the date off
          # the frame rather than asking the runner.
          DATE=$(python -c "import chain; print(chain.load_frames()[-1]['date'])")
          git diff --staged --quiet || git commit -m "frame: $DATE"
          git push
