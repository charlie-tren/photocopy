name: daily-frame

on:
  schedule:
    # 20:40 UTC / 06:40 AEST. Deliberately off the hour: The Aftertimes found
    # that the on-the-hour slot is congested enough on GitHub's schedulers to be
    # dropped or run an hour late.
    # Two crons, both inside the same UTC day so the already-filed guard in
    # step.py makes the second one a no-op when the first worked. The Aftertimes
    # learned this the hard way: a single on-the-hour schedule ran 40-64 minutes
    # late and was sometimes dropped entirely.
    #
    # THE BACKUP MUST LAND BEFORE CHARLIE LOOKS, which is 07:55 AEST / 21:55 UTC.
    # On 26/08/2026 GitHub dropped the 20:40 primary here, in The Aftertimes and in
    # the hub's thumbnail job, all three in the same 20:40-21:05 UTC band. Every one
    # of them had a backup and every backup was scheduled AFTER 07:55, so he opened
    # the site to yesterday's frame and the system quietly healed an hour later.
    # A backup that runs after the reader has gone is not a backup.
    #
    # Allow 16-22 minutes of scheduler lateness on every line below - that is
    # measured, not assumed, and it is why 21:05 is the last slot that still clears
    # 21:55 with room.
    - cron: "40 19 * * *"   # 19:40 UTC / 05:40 AEST - primary. Moved an hour earlier
                            # than the old 20:40: One Story sits at 18:00/19:00 and was
                            # the ONLY daily job GitHub did not drop on 26/08.
    - cron: "05 21 * * *"   # 21:05 UTC / 07:05 AEST - backup, lands ~07:21-07:27, so
                            # a dropped primary is still fixed before he opens the page.
    - cron: "40 22 * * *"   # 22:40 UTC / 08:40 AEST - third line. Too late to save the
                            # morning, kept because a frame is better late than missing.
  workflow_dispatch:

permissions:
  contents: write
  issues: write        # the alarm when a day is refused on content

concurrency:
  # Two frames in one day would both describe the same parent, and the chain's
  # only claim is that each frame came from the one before it.
  group: chain
  cancel-in-progress: false

jobs:
  frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest tests/ -q
      # The tests run before the chain advances and the commit step is a blanket
      # `git add -A`, so anything a test writes into the working copy gets
      # committed as if the chain had produced it. That is how 32 fixture rows
      # reached data/rejections.jsonl - the one file that is supposed to show a
      # real refusal. Fail here rather than let it happen quietly again.
      - name: The tests must not have written anything
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'pytest dirtied the working copy:'
            git status --porcelain
            git diff
            exit 1
          fi
      - name: Advance the chain
        id: advance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        # Exit 3 means the decency check refused every attempt - a real outcome,
        # not a broken build, and the rejection log is worth committing either
        # way. Anything else is still a hard failure.
        run: |
          set +e
          python step.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi
      - name: Commit and push
        run: |
          git config user.name "photocopy bot"
          git config user.email "actions@github.com"
          git add -A
          # The frame itself is stamped in Australia/Sydney (common.tz_now), so
          # the runner's UTC date disagrees with it for the ~10h either side of
          # midnight - which is exactly when this job runs. Read the date off
          # the frame rather than asking the runner.
          DATE=$(python -c "import chain; f=chain.load_frames(); print(f[-1]['date'] if f else 'none')")
          if [ "${{ steps.advance.outputs.code }}" = "3" ]; then
            git diff --staged --quiet || git commit -m "no publishable frame - rejections logged"
          else
            git diff --staged --quiet || git commit -m "frame: $DATE"
          fi
          git push

      # A silent gap is how a guard stops being a guard: before this, an
      # abandoned day looked identical to nothing happening, and the site would
      # simply stop gaining frames until someone noticed weeks later. One issue
      # per day, so a run of bad days is a readable list rather than a flood.
      - name: Raise the alarm if the day was refused
        if: steps.advance.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TITLE="Photocopy: no publishable frame ($DATE)"
          if gh issue list --state open --search "$TITLE in:title" | grep -q .; then
            echo "already raised"
            exit 0
          fi
          gh issue create --title "$TITLE"             --body "The decency check refused every attempt today, so no frame was published and the chain did not advance.

          The last few rejections, with the prompt that caused each, are in \`data/rejections.jsonl\`. If the reasons all name the same thing, the description is steering there and the seed or the describer needs looking at - redrawing will not fix it.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
